<ion-content fullscreen class="onboarding-content" [scrollY]="false">
  <div class="onboarding">

    <button class="onboarding__skip" (click)="skip()" *ngIf="!isLastSlide">Skip</button>

    <div class="onboarding__track">
      <div
        class="onboarding__slide"
        *ngFor="let slide of slides; let i = index"
        [class.onboarding__slide--active]="i === activeIndex"
      >
        <div class="onboarding__art">
          <img [src]="slide.image" [alt]="slide.title" />
        </div>
        <h1>{{ slide.title }}</h1>
        <p>{{ slide.text }}</p>
      </div>
    </div>

    <div class="onboarding__footer">
      <div class="onboarding__dots">
        <span
          *ngFor="let slide of slides; let i = index"
          class="dot"
          [class.dot--active]="i === activeIndex"
          (click)="goTo(i)"
        ></span>
      </div>

      <ion-button expand="block" shape="round" class="onboarding__cta" (click)="next()">
        {{ isLastSlide ? 'Get Started' : 'Next' }}
        <ion-icon slot="end" [name]="isLastSlide ? 'checkmark-done' : 'chevron-forward'"></ion-icon>
      </ion-button>
    </div>

  </div>
</ion-content>
